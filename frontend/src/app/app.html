<ng-container *ngIf="!showLayout">
  <router-outlet></router-outlet>
</ng-container>

<div *ngIf="showLayout" class="flex h-screen bg-brand-dark overflow-hidden font-sans text-brand-text">
  
  <app-sidebar></app-sidebar>

  <main class="flex-1 overflow-y-auto p-8 relative">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-brand-primary/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>

    <header class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-3xl font-bold text-white tracking-tight">Nova Kontrol Merkezi</h2>
        <p class="text-gray-400 text-sm mt-1">Yetki seviyenize göre sistem verileri senkronize edildi.</p>
      </div>
      <div class="flex items-center gap-4">
        <button class="bg-brand-light border border-gray-700 hover:border-brand-primary/50 p-2.5 rounded-full text-gray-400 hover:text-white transition-all shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
        </button>
      </div>
    </header>

    <div class="pb-10">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
