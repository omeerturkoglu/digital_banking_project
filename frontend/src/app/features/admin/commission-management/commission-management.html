<div class="space-y-6">
  
  <div class="flex items-center justify-between mb-8">
    <div>
      <h2 class="text-3xl font-bold text-white tracking-tight">Komisyon ve Ücret Yönetimi</h2>
      <p class="text-gray-400 text-sm mt-1">İşlem tiplerine göre uygulanan komisyon oranları ve sabit ücretler.</p>
    </div>
    <button (click)="openModal()" class="bg-brand-primary/20 text-emerald-400 border border-brand-primary/30 px-4 py-2 rounded-xl text-sm font-bold hover:bg-brand-primary hover:text-brand-dark transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
      Yeni Kural Ekle
    </button>
  </div>

  <!-- Commission Table -->
  <div class="backdrop-blur-xl bg-white/5 rounded-3xl border border-white/10 shadow-2xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider">
            <th class="p-4 font-semibold">İşlem Tipi</th>
            <th class="p-4 font-semibold">Müşteri Segmenti</th>
            <th class="p-4 font-semibold text-right">Oran / Tutar</th>
            <th class="p-4 font-semibold text-center">Durum</th>
            <th class="p-4 font-semibold text-right">Aksiyonlar</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-800">
          <tr *ngFor="let rule of commissionRules" class="hover:bg-white/5 transition-colors">
            <td class="p-4 text-sm font-bold text-white">{{ rule.type }}</td>
            <td class="p-4">
              <span class="px-2 py-1 text-[10px] uppercase font-bold rounded-md" 
                    [class.bg-purple-500/20]="rule.role === 'VIP'" [class.text-purple-400]="rule.role === 'VIP'"
                    [class.bg-gray-700]="rule.role === 'CUSTOMER'" [class.text-gray-300]="rule.role === 'CUSTOMER'">
                {{ rule.role }}
              </span>
            </td>
            <td class="p-4 text-sm text-emerald-400 font-bold text-right">
              <span *ngIf="rule.isPercentage">%{{ rule.rateOrAmount }}</span>
              <span *ngIf="!rule.isPercentage">₺{{ rule.rateOrAmount }}</span>
            </td>
            <td class="p-4 text-center">
              <button (click)="toggleStatus(rule)" class="relative inline-flex items-center h-5 rounded-full w-9 transition-colors focus:outline-none" [class.bg-emerald-500]="rule.active" [class.bg-gray-600]="!rule.active">
                <span class="inline-block w-3 h-3 transform bg-white rounded-full transition-transform" [class.translate-x-5]="rule.active" [class.translate-x-1]="!rule.active"></span>
              </button>
            </td>
            <td class="p-4 text-right flex justify-end gap-3">
              <button (click)="openModal(rule)" class="text-gray-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
              </button>
              <button class="text-brand-accent hover:text-pink-400 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit/Add Modal (Simplified) -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="max-w-md w-full bg-brand-light border border-gray-700 rounded-3xl p-6 shadow-2xl relative">
      <button (click)="closeModal()" class="absolute right-4 top-4 text-gray-400 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>

      <h3 class="text-xl font-bold text-white mb-6">{{ editingRule?.id ? 'Kuralı Düzenle' : 'Yeni Kural Ekle' }}</h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-2">İşlem Tipi</label>
          <input type="text" [(ngModel)]="editingRule.type" placeholder="Örn: EFT" class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-brand-primary">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Müşteri Segmenti</label>
          <select [(ngModel)]="editingRule.role" class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-brand-primary">
            <option value="CUSTOMER">Standart Müşteri</option>
            <option value="VIP">VIP Müşteri</option>
          </select>
        </div>

        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Ücret Tipi</label>
            <select [(ngModel)]="editingRule.isPercentage" class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-brand-primary">
              <option [ngValue]="true">Yüzde (%)</option>
              <option [ngValue]="false">Sabit Tutar (₺)</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Değer</label>
            <input type="text" [(ngModel)]="editingRule.rateOrAmount" class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-brand-primary">
          </div>
        </div>

        <button (click)="saveRule()" class="w-full mt-4 bg-brand-primary hover:bg-emerald-400 text-brand-dark font-extrabold py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)]">
          Kaydet
        </button>
      </div>

    </div>
  </div>

</div>
