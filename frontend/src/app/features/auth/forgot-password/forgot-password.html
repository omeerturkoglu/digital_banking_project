<div class="min-h-screen bg-brand-dark flex items-center justify-center p-4">
  
  <div class="max-w-md w-full bg-brand-light border border-gray-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-brand-accent/20 blur-3xl rounded-full pointer-events-none"></div>

    <div class="flex items-center justify-center gap-3 mb-8 relative z-10">
      <div class="w-12 h-12 rounded-xl bg-brand-light border border-gray-700 flex items-center justify-center shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
    </div>

    <h2 class="text-2xl font-bold text-white text-center mb-2">Şifre Güncelleme</h2>
    <p class="text-gray-400 text-center text-sm mb-8">Güvenliğiniz için T.C. Kimlik numaranızı ve mevcut şifrenizi doğrulayarak yeni şifre belirleyin.</p>

    <div class="space-y-5">
      
      <!-- TCKN -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">T.C. Kimlik Numarası</label>
        <input type="text" [(ngModel)]="tcNo" (input)="onTcInput($event)" maxlength="11" placeholder="11 Haneli T.C. Kimlik No" 
               class="w-full bg-brand-dark border rounded-xl px-4 py-3 text-white focus:outline-none transition-colors border-gray-700 focus:border-brand-primary">
      </div>

      <!-- Mevcut Şifre -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Mevcut Şifre</label>
        <input type="password" [(ngModel)]="currentPassword" placeholder="••••••••" 
               class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-primary transition-colors">
      </div>

      <!-- Yeni Şifre -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Yeni Şifre</label>
        <input type="password" [(ngModel)]="newPassword" placeholder="En az 6 karakter" 
               class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-primary transition-colors">
      </div>

      <!-- Yeni Şifre Tekrar -->
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Yeni Şifre Tekrar</label>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Şifrenizi onaylayın" 
               class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-primary transition-colors">
        <p *ngIf="confirmPassword.length > 0 && newPassword !== confirmPassword" class="text-red-500 text-[10px] mt-1.5 ml-1 font-bold">Şifreler uyuşmuyor!</p>
      </div>

      <!-- Başarı/Hata Mesajları -->
      <div *ngIf="successMessage" class="bg-emerald-500/10 border border-emerald-500/50 p-3 rounded-xl text-emerald-500 text-xs font-bold">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 p-3 rounded-xl text-red-500 text-xs font-bold">
        {{ errorMessage }}
      </div>

      <button (click)="onSubmit()" [disabled]="!isFormValid || isSubmitting" 
              class="w-full mt-6 bg-brand-primary hover:bg-emerald-400 text-brand-dark font-extrabold py-4 px-4 rounded-xl transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
        <span *ngIf="!isSubmitting">Şifreyi Güncelle</span>
        <span *ngIf="isSubmitting">Güncelleniyor...</span>
      </button>

      <div class="mt-6 text-center">
        <a routerLink="/login" class="text-sm text-gray-400 hover:text-white transition-colors flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          Giriş Ekranına Dön
        </a>
      </div>
    </div>

  </div>
</div>
